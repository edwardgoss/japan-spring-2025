<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Japan Spring 2025</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

  :root{
    --bg:#f5f5f5;
    --text:#222;
    --text-secondary:#888;
    --header-bg:rgba(245,245,245,.85);
    --gap:6px;
    --lightbox-bg:rgba(0,0,0,.92);
    --menu-bg:#fff;
    --menu-shadow:0 4px 20px rgba(0,0,0,.12);
    --menu-hover:rgba(0,0,0,.04);
    --menu-active-bg:#222;
    --menu-active-text:#fff;
    --menu-border:rgba(0,0,0,.06);
  }
  @media(prefers-color-scheme:dark){
    :root{
      --bg:#111;
      --text:#e0e0e0;
      --text-secondary:#777;
      --header-bg:rgba(17,17,17,.85);
      --menu-bg:#1e1e1e;
      --menu-shadow:0 4px 20px rgba(0,0,0,.4);
      --menu-hover:rgba(255,255,255,.06);
      --menu-active-bg:#e0e0e0;
      --menu-active-text:#111;
      --menu-border:rgba(255,255,255,.08);
    }
  }

  body{
    background:var(--bg);
    color:var(--text);
    font-family:'Libre Baskerville',Georgia,'Times New Roman',serif;
    min-height:100vh;
  }

  /* ── Header ── */
  header{
    position:sticky;top:0;z-index:50;
    background:var(--header-bg);
    backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
    padding:12px 24px 10px;
    text-align:center;
  }

  .header-top{
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
  }

  header h1{
    font-size:1.4rem;
    font-weight:600;
    letter-spacing:.04em;
    line-height:1.3;
  }
  .header-byline{
    font-weight:400;
    font-size:.7rem;
    opacity:.4;
    letter-spacing:.02em;
  }

  /* Hamburger button */
  .menu-btn{
    position:absolute;
    right:0;top:50%;transform:translateY(-50%);
    background:none;border:none;
    color:var(--text);
    font-size:1.2rem;
    cursor:pointer;
    opacity:.5;
    transition:opacity .2s;
    padding:4px 2px;
    line-height:1;
  }
  .menu-btn:hover{opacity:.8}

  /* Now showing label */
  .now-showing{
    font-size:.7rem;
    color:var(--text-secondary);
    margin-top:3px;
    height:1.1em;
    letter-spacing:.02em;
    transition:opacity .25s ease;
  }
  .now-showing.hidden{opacity:0}
  .now-showing-label{
    opacity:.6;
  }
  .now-showing-city{
    font-style:italic;
  }
  .now-showing-filtered{
    opacity:.4;
    font-size:.6rem;
  }

  /* ── Dropdown menu ── */
  .menu-overlay{
    position:fixed;inset:0;z-index:49;
    display:none;
  }
  .menu-overlay.open{display:block}

  .menu-dropdown{
    position:absolute;
    top:100%;right:24px;
    background:var(--menu-bg);
    border-radius:8px;
    box-shadow:var(--menu-shadow);
    min-width:200px;
    padding:6px 0;
    z-index:51;
    opacity:0;
    transform:translateY(-4px);
    pointer-events:none;
    transition:opacity .15s ease,transform .15s ease;
  }
  .menu-dropdown.open{
    opacity:1;
    transform:translateY(0);
    pointer-events:auto;
  }

  .menu-item{
    display:flex;
    align-items:center;
    justify-content:space-between;
    width:100%;
    background:none;border:none;
    padding:9px 16px;
    font-family:'Libre Baskerville',Georgia,'Times New Roman',serif;
    font-size:.75rem;
    color:var(--text);
    cursor:pointer;
    text-align:left;
    transition:background .15s;
    letter-spacing:.02em;
  }
  .menu-item:hover{
    background:var(--menu-hover);
  }
  .menu-item.active{
    background:var(--menu-active-bg);
    color:var(--menu-active-text);
  }
  .menu-item-count{
    opacity:.4;
    font-size:.65rem;
    margin-left:12px;
    font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    font-variant-numeric:tabular-nums;
  }
  .menu-item.active .menu-item-count{
    opacity:.6;
  }

  .menu-divider{
    height:1px;
    background:var(--menu-border);
    margin:4px 0;
  }

  /* ── Masonry grid ── */
  .gallery{
    position:relative;
    padding:var(--gap);
    max-width:1800px;
    margin:0 auto;
    transition:opacity .1s ease;
  }
  .gallery.settling{opacity:.98}
  .gallery.settling-deep{opacity:.95;transition:opacity .18s ease}

  .gallery-item{
    position:absolute;
    cursor:pointer;
    border-radius:4px;
    overflow:hidden;
    line-height:0;
    opacity:0;
    transform:translateY(12px);
    transition:opacity .4s ease,transform .4s ease;
  }
  .gallery-item.loaded{
    opacity:1;
    transform:translateY(0);
  }
  .gallery-item.filtered-out{
    display:none !important;
  }
  .gallery-item img{
    width:100%;
    height:auto;
    display:block;
    transition:transform .3s ease;
  }
  .gallery-item:hover img{
    transform:scale(1.03);
  }

  /* ── Lightbox ── */
  .lightbox{
    position:fixed;inset:0;z-index:100;
    background:var(--lightbox-bg);
    display:none;
    align-items:center;
    justify-content:center;
    opacity:0;
    transition:opacity .25s ease;
  }
  .lightbox.active{
    display:flex;
    opacity:1;
  }
  .lightbox img{
    max-width:92vw;
    max-height:85vh;
    object-fit:contain;
    border-radius:4px;
    user-select:none;
    -webkit-user-drag:none;
  }

  .lightbox-close{
    position:absolute;top:16px;right:20px;
    background:none;border:none;
    color:#fff;font-size:2rem;
    cursor:pointer;opacity:.7;
    transition:opacity .2s;
    line-height:1;
    z-index:110;
  }
  .lightbox-close:hover{opacity:1}

  .lightbox-nav{
    position:absolute;top:50%;transform:translateY(-50%);
    background:none;border:none;
    color:#fff;font-size:2.4rem;
    cursor:pointer;opacity:.5;
    transition:opacity .2s;
    padding:12px;
    z-index:110;
    user-select:none;
  }
  .lightbox-nav:hover{opacity:1}
  .lightbox-prev{left:12px}
  .lightbox-next{right:12px}

  .lightbox-caption{
    position:absolute;bottom:16px;left:50%;transform:translateX(-50%);
    text-align:center;
    z-index:110;
    max-width:80vw;
  }
  .lightbox-location{
    color:#fff;
    font-family:'Libre Baskerville',Georgia,'Times New Roman',serif;
    font-size:.85rem;
    letter-spacing:.02em;
    line-height:1.4;
  }
  .lightbox-city{opacity:.5}
  .lightbox-place{opacity:.85}
  .lightbox-counter{
    font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    font-variant-numeric:tabular-nums;
    font-size:.7rem;
    color:rgba(255,255,255,.4);
    margin-top:4px;
    letter-spacing:.04em;
    line-height:1;
  }
  .lightbox-sep{opacity:.45;margin:0 2px}

  .lightbox-spinner{
    position:absolute;
    width:36px;height:36px;
    border:3px solid rgba(255,255,255,.2);
    border-top-color:#fff;
    border-radius:50%;
    animation:spin .7s linear infinite;
    display:none;
  }
  .lightbox.loading .lightbox-spinner{display:block}
  @keyframes spin{to{transform:rotate(360deg)}}

  .jp{
  opacity:.65;
  font-size:.85em;
  margin-left:.25em;
  font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,
               "Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic",sans-serif;
  }

  /* ── Mobile ── */
  @media(max-width:600px){
    header{padding:10px 16px 8px}
    header h1{font-size:1.1rem}
    .header-byline{font-size:.6rem}
    .now-showing{font-size:.6rem}
    .menu-btn{font-size:1.1rem}
    .menu-dropdown{right:16px;min-width:180px}
    .menu-item{padding:8px 14px;font-size:.7rem}
    .lightbox-location{font-size:.75rem}
  }
</style>
</head>

</div>

  };

  // ── Build city lookup ──
  const cityMap={};
  for(let i=1;i<=TOTAL;i++){
    for(const entry of CITY_RANGES){
      for(const r of entry.ranges){
        if(i>=r[0]&&i<=r[1]) cityMap[i]=entry.city;
      }
    }
  }

  const cityOrder=[];
  const seen={};
  for(let i=1;i<=TOTAL;i++){
    const c=cityMap[i];
    if(c&&!seen[c]){cityOrder.push(c);seen[c]=true}
  }

  const cityCounts={All:TOTAL};
  for(let i=1;i<=TOTAL;i++){
    const c=cityMap[i];
    if(c) cityCounts[c]=(cityCounts[c]||0)+1;
  }

  // ── DOM refs ──
  const gallery=document.getElementById('gallery');
  const lightbox=document.getElementById('lightbox');
  const lbImg=lightbox.querySelector('img');
  const lbCity=lightbox.querySelector('.lightbox-city');
  const lbPlace=lightbox.querySelector('.lightbox-place');
  const lbCounter=lightbox.querySelector('.lightbox-counter');
  const nowShowingEl=document.getElementById('nowShowing');
  const menuBtn=document.getElementById('menuBtn');
  const menuDropdown=document.getElementById('menuDropdown');
  const menuOverlay=document.getElementById('menuOverlay');

  let current=0;
  let activeFilter='All';
  const items=[];
  let filtered=[];
  let menuOpen=false;

  // ── Build hamburger menu ──
  const allCities=['All',...cityOrder];
  allCities.forEach(function(city,i){
    if(i===1){
      const div=document.createElement('div');
      div.className='menu-divider';
      menuDropdown.appendChild(div);
    }
    const btn=document.createElement('button');
    btn.className='menu-item'+(city==='All'?' active':'');
    btn.dataset.city=city;
    btn.innerHTML=city+'<span class="menu-item-count">'+(cityCounts[city]||0)+'</span>';
    btn.addEventListener('click',function(){
      setFilter(city);
      closeMenu();
    });
    menuDropdown.appendChild(btn);
  });

  function openMenu(){
    menuOpen=true;
    menuDropdown.classList.add('open');
    menuOverlay.classList.add('open');
  }
  function closeMenu(){
    menuOpen=false;
    menuDropdown.classList.remove('open');
    menuOverlay.classList.remove('open');
  }

  menuBtn.addEventListener('click',function(e){
    e.stopPropagation();
    if(menuOpen) closeMenu(); else openMenu();
  });
  menuOverlay.addEventListener('click',closeMenu);

  // ── Filter logic ──
  function getTopVisibleIndex(){
    // Find which filtered photo is closest to just below the header
    var headerH=document.querySelector('header').offsetHeight;
    var scanY=headerH+20;
    var bestIdx=-1, bestDist=Infinity;
    for(var fi=0;fi<filtered.length;fi++){
      var rect=items[filtered[fi]].el.getBoundingClientRect();
      var dist=Math.abs(rect.top-scanY);
      if(rect.bottom>headerH&&dist<bestDist){
        bestDist=dist;
        bestIdx=filtered[fi];
      }
    }
    return bestIdx;
  }

  function setFilter(city){
    // Capture which photo is currently at the top before changing filter
    var anchorIdx=getTopVisibleIndex();

    activeFilter=city;
    menuDropdown.querySelectorAll('.menu-item').forEach(function(m){
      m.classList.toggle('active',m.dataset.city===city);
    });
    updateFiltered();
    layout();
    lastShownKey=''; // force update since filter changed

    // Try to scroll to the anchor photo's new position
    var scrollTarget=-1;
    if(anchorIdx>=0){
      if(city==='All'){
        // All always contains every photo
        scrollTarget=anchorIdx;
      }else{
        // Check if the anchor photo is in the new filtered set
        var anchorNum=anchorIdx+1;
        if(cityMap[anchorNum]===city){
          scrollTarget=anchorIdx;
        }
      }
    }

    if(scrollTarget>=0){
      gallery.classList.add('settling');
      var headerH=document.querySelector('header').offsetHeight;
      var el=items[scrollTarget].el;
      var galleryTop=gallery.getBoundingClientRect().top+window.scrollY;
      var photoTop=parseFloat(el.style.top)+galleryTop;
      window.scrollTo({top:photoTop-headerH-10,behavior:'instant'});
      requestAnimationFrame(function(){
        gallery.classList.remove('settling');
      });
    }else{
      // Anchor photo not in new filter — deeper settle signals context change
      gallery.classList.add('settling-deep');
      window.scrollTo({top:0,behavior:'instant'});
      requestAnimationFrame(function(){
        gallery.classList.remove('settling-deep');
      });
    }

    updateNowShowing();
  }

  function updateFiltered(){
    filtered=[];
    items.forEach(function(item,idx){
      const photoNum=idx+1;
      const match=activeFilter==='All'||cityMap[photoNum]===activeFilter;
      item.el.classList.toggle('filtered-out',!match);
      if(match) filtered.push(idx);
    });
  }

  // ── "Now showing" label ──
  let lastShownKey='';
  function nowShowingHTML(city){
    var html='<span class="now-showing-label">Now showing \u00b7 </span><span class="now-showing-city">'+city+'</span>';
    if(activeFilter!=='All') html+=' <span class="now-showing-filtered">\u00b7 Filtered</span>';
    return html;
  }
  function setNowShowing(city){
    var key=city+'|'+activeFilter;
    if(key===lastShownKey) return;
    lastShownKey=key;
    nowShowingEl.classList.add('hidden');
    setTimeout(function(){
      nowShowingEl.innerHTML=nowShowingHTML(city);
      nowShowingEl.classList.remove('hidden');
    },200);
  }
  function setNowShowingImmediate(city){
    var key=city+'|'+activeFilter;
    if(key===lastShownKey&&nowShowingEl.innerHTML) return;
    lastShownKey=key;
    nowShowingEl.innerHTML=nowShowingHTML(city);
    nowShowingEl.classList.remove('hidden');
  }

  function updateNowShowing(){
    // When filtered to a city, show that city immediately
    if(activeFilter!=='All'){
      setNowShowingImmediate(activeFilter);
      return;
    }
    // In "All" mode, detect from scroll position
    const headerH=document.querySelector('header').offsetHeight;
    const scanY=headerH+50;
    let bestCity='';
    let bestDist=Infinity;

    for(let fi=0;fi<filtered.length;fi++){
      const item=items[filtered[fi]];
      const rect=item.el.getBoundingClientRect();
      const dist=Math.abs(rect.top-scanY);
      if(rect.bottom>headerH&&dist<bestDist){
        bestDist=dist;
        bestCity=cityMap[filtered[fi]+1]||'';
      }
    }

    if(bestCity){
      if(!nowShowingEl.innerHTML) setNowShowingImmediate(bestCity);
      else setNowShowing(bestCity);
    }
  }

  // ── Build gallery items ──
  for(let i=1;i<=TOTAL;i++){
    const num=String(i).padStart(3,'0');
    const src='photos/Japan_Spring-2025_'+num+'.jpg';
    const div=document.createElement('div');
    div.className='gallery-item';
    div.dataset.index=i-1;
    div.dataset.photoNum=i;
    const img=document.createElement('img');
    img.alt='Japan Spring 2025 - '+(cityMap[i]||'Photo')+' '+i;
    img.src=src;
    div.appendChild(img);
    gallery.appendChild(div);
    items.push({el:div,img:img,ratio:0,loaded:false});
  }

  updateFiltered();

  // ── Masonry layout ──
  function layout(){
    const cols=getColCount();
    const containerW=gallery.clientWidth;
    const colW=(containerW-(cols-1)*GAP)/cols;
    const colHeights=new Array(cols).fill(0);

    for(let fi=0;fi<filtered.length;fi++){
      const item=items[filtered[fi]];
      let minH=colHeights[0],minCol=0;
      for(let c=1;c<cols;c++){
        if(colHeights[c]<minH){minH=colHeights[c];minCol=c}
      }
      const x=minCol*(colW+GAP);
      const y=colHeights[minCol];
      const h=item.ratio?colW/item.ratio:colW;

      item.el.style.left=x+'px';
      item.el.style.top=y+'px';
      item.el.style.width=colW+'px';

      colHeights[minCol]=y+h+GAP;
    }
    gallery.style.height=(filtered.length?Math.max(...colHeights):0)+'px';
  }

  function getColCount(){
    const w=gallery.clientWidth;
    if(w<=480)return 1;
    if(w<=800)return 2;
    if(w<=1200)return 3;
    return 4;
  }

  // ── Image load tracking ──
  items.forEach(function(item){
    if(item.img.complete&&item.img.naturalWidth){
      item.ratio=item.img.naturalWidth/item.img.naturalHeight;
      item.loaded=true;
      item.el.classList.add('loaded');
    }else{
      item.img.onload=function(){
        item.ratio=item.img.naturalWidth/item.img.naturalHeight;
        item.loaded=true;
        item.el.classList.add('loaded');
        layout();
      };
    }
  });

  layout();
  updateNowShowing();

  let resizeTimer;
  window.addEventListener('resize',function(){
    clearTimeout(resizeTimer);
    resizeTimer=setTimeout(layout,100);
  });

  let scrollTicking=false;
  window.addEventListener('scroll',function(){
    if(!scrollTicking){
      scrollTicking=true;
      requestAnimationFrame(function(){
        updateNowShowing();
        scrollTicking=false;
      });
    }
  },{passive:true});

  // ── Lightbox ──
  gallery.addEventListener('click',function(e){
    const item=e.target.closest('.gallery-item');
    if(!item||item.classList.contains('filtered-out'))return;
    const idx=parseInt(item.dataset.index,10);
    current=filtered.indexOf(idx);
    if(current===-1)return;
    openLightbox();
  });

  function photoSrc(idx){
    return 'photos/Japan_Spring-2025_'+String(idx+1).padStart(3,'0')+'.jpg';
  }

  function openLightbox(){
    const realIdx=filtered[current];
    const photoNum=realIdx+1;
    lightbox.classList.add('loading');
    lbImg.onload=function(){lightbox.classList.remove('loading')};
    lbImg.src=photoSrc(realIdx);
    lbImg.alt='Japan Spring 2025 - Photo '+photoNum;

    const city=cityMap[photoNum]||'';
    const place=CAPTIONS[photoNum]||'';
    if(place){
      lbCity.textContent=city+' \u2014 ';
      lbPlace.innerHTML=place;
    }else{
      lbCity.textContent=city;
      lbPlace.textContent='';
    }

    lbCounter.innerHTML=(current+1)+' <span class="lightbox-sep">\u00b7</span> '+filtered.length;

    // Hide nav arrows at boundaries
    lightbox.querySelector('.lightbox-prev').style.display=current<=0?'none':'';
    lightbox.querySelector('.lightbox-next').style.display=current>=filtered.length-1?'none':'';

    lightbox.classList.add('active');
    document.body.style.overflow='hidden';
  }

  function closeLightbox(){
    lightbox.classList.remove('active','loading');
    document.body.style.overflow='';
    lbImg.src='';
    // Scroll grid to the photo the user was viewing
    if(current>=0&&current<filtered.length){
      var el=items[filtered[current]].el;
      var headerH=document.querySelector('header').offsetHeight;
      var galleryTop=gallery.getBoundingClientRect().top+window.scrollY;
      var photoTop=parseFloat(el.style.top)+galleryTop;
      window.scrollTo({top:photoTop-headerH-10,behavior:'instant'});
    }
  }

  function navigate(dir){
    var next=current+dir;
    if(next<0||next>=filtered.length) return;
    current=next;
    openLightbox();
  }

  lightbox.querySelector('.lightbox-close').addEventListener('click',closeLightbox);
  lightbox.querySelector('.lightbox-prev').addEventListener('click',function(){navigate(-1)});
  lightbox.querySelector('.lightbox-next').addEventListener('click',function(){navigate(1)});

  lightbox.addEventListener('click',function(e){
    if(e.target===lightbox)closeLightbox();
  });

  document.addEventListener('keydown',function(e){
    if(!lightbox.classList.contains('active'))return;
    if(e.key==='Escape')closeLightbox();
    else if(e.key==='ArrowLeft')navigate(-1);
    else if(e.key==='ArrowRight')navigate(1);
  });

  let touchStartX=0;
  lightbox.addEventListener('touchstart',function(e){
    touchStartX=e.changedTouches[0].screenX;
  },{passive:true});
  lightbox.addEventListener('touchend',function(e){
    const diff=e.changedTouches[0].screenX-touchStartX;
    if(Math.abs(diff)>50){
      navigate(diff>0?-1:1);
    }
  },{passive:true});
})();
