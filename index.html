<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Japan Spring 2025</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

  :root{
    --bg:#f5f5f5;
    --text:#222;
    --text-secondary:#888;
    --header-bg:rgba(245,245,245,.85);
    --gap:6px;
    --lightbox-bg:rgba(0,0,0,.92);
    --menu-bg:#fff;
    --menu-shadow:0 4px 20px rgba(0,0,0,.12);
    --menu-hover:rgba(0,0,0,.04);
    --menu-active-bg:#222;
    --menu-active-text:#fff;
    --menu-border:rgba(0,0,0,.06);
  }
  @media(prefers-color-scheme:dark){
    :root{
      --bg:#111;
      --text:#e0e0e0;
      --text-secondary:#777;
      --header-bg:rgba(17,17,17,.85);
      --menu-bg:#1e1e1e;
      --menu-shadow:0 4px 20px rgba(0,0,0,.4);
      --menu-hover:rgba(255,255,255,.06);
      --menu-active-bg:#e0e0e0;
      --menu-active-text:#111;
      --menu-border:rgba(255,255,255,.08);
    }
  }

  html{
    -webkit-text-size-adjust:100%;
    text-size-adjust:100%;
  }
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'Libre Baskerville',Georgia,'Times New Roman',serif;
    min-height:100vh;
  }

  /* ── Header ── */
  header{
    position:sticky;top:0;z-index:50;
    background:var(--header-bg);
    backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
    padding:12px 24px 10px;
    text-align:center;
  }

  .header-top{
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
  }

  header h1{
    font-size:1.4rem;
    font-weight:600;
    letter-spacing:.04em;
    line-height:1.3;
  }
  
  /* Title is tappable, but should not look like a button */
  #titleTap{
    cursor:pointer;
    -webkit-tap-highlight-color: transparent;
  }
.header-byline{
    font-weight:400;
    font-size:.7rem;
    opacity:.4;
    letter-spacing:.02em;
  }

  /* Hamburger button */
  .menu-btn{
    position:absolute;
    right:0;top:50%;transform:translateY(-50%);
    background:none;border:none;
    color:var(--text);
    font-size:1.2rem;
    cursor:pointer;
    opacity:.5;
    transition:opacity .2s;
    padding:4px 2px;
    line-height:1;
  }
  .menu-btn:hover{opacity:.8}

  /* Now showing label */
  .now-showing{
    font-size:.7rem;
    color:var(--text-secondary);
    margin-top:3px;
    height:1.1em;
    letter-spacing:.02em;
    transition:opacity .15s ease-out;
    transform:translate3d(0,0,0);
    will-change:opacity;
    -webkit-font-smoothing:antialiased;
  }
  .now-showing.hidden{opacity:0}
  .now-showing-label{
    opacity:.6;
  }
  .now-showing-city{
    font-style:italic;
  }
  .now-showing-filtered{
    opacity:.4;
    font-size:.6rem;
  }

  /* ── Dropdown menu ── */
  .menu-overlay{
    position:fixed;inset:0;z-index:49;
    display:none;
  }
  .menu-overlay.open{display:block}

  .menu-dropdown{
    position:absolute;
    top:100%;right:24px;
    background:var(--menu-bg);
    border-radius:8px;
    box-shadow:var(--menu-shadow);
    min-width:200px;
    padding:6px 0;
    z-index:51;
    opacity:0;
    transform:translateY(-4px);
    pointer-events:none;
    transition:opacity .15s ease,transform .15s ease;
  }
  .menu-dropdown.open{
    opacity:1;
    transform:translateY(0);
    pointer-events:auto;
  }

  .menu-item{
    display:flex;
    align-items:center;
    justify-content:space-between;
    width:100%;
    background:none;border:none;
    padding:9px 16px;
    font-family:'Libre Baskerville',Georgia,'Times New Roman',serif;
    font-size:.75rem;
    color:var(--text);
    cursor:pointer;
    text-align:left;
    transition:background .15s;
    letter-spacing:.02em;
  }
.menu-clear-all{margin-top:10px; font-size:0.9rem; opacity:0.9;}
  .menu-item:hover{
    background:var(--menu-hover);
  }
  .menu-item.active{
    background:var(--menu-active-bg);
    color:var(--menu-active-text);
  }
  .menu-item-count{
    opacity:.4;
    font-size:.65rem;
    margin-left:12px;
    font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    font-variant-numeric:tabular-nums;
  }
  .menu-item.active .menu-item-count{
    opacity:.6;
  }

  .menu-search{
    padding:8px 12px 4px;
    position:relative;
  }
  .menu-search input{
    width:100%;
    padding:7px 26px 7px 10px;
    border:1px solid var(--menu-border);
    border-radius:5px;
    background:transparent;
    color:var(--text);
    font-family:'Libre Baskerville',Georgia,'Times New Roman',serif;
    font-size:.7rem;
    outline:none;
    letter-spacing:.02em;
    transition:border-color .15s;
  }
  .menu-search-clear{
    position:absolute;
    right:16px;top:50%;
    transform:translateY(-70%);
    background:none;border:none;
    color:var(--text-secondary);
    font-size:.75rem;
    cursor:pointer;
    opacity:0;
    pointer-events:none;
    transition:opacity .15s;
    padding:2px 4px;
    line-height:1;
  }
  .menu-search-clear.visible{
    opacity:.5;
    pointer-events:auto;
  }
  .menu-search-clear:hover{opacity:.8}
  .menu-search input::placeholder{
    color:var(--text-secondary);
    opacity:.6;
  }
  .menu-search input:focus{
    border-color:var(--text-secondary);
  }
  .menu-search-hint{
    font-size:.55rem;
    color:var(--text-secondary);
    opacity:.5;
    padding:3px 2px 0;
    letter-spacing:.01em;
  }

  .no-results{
    text-align:center;
    color:var(--text-secondary);
    font-size:.8rem;
    padding:60px 20px;
    opacity:.5;
    font-style:italic;
    display:none;
  }
  .no-results.visible{display:block}

  .menu-divider{
    height:1px;
    background:var(--menu-border);
    margin:4px 0;
  }

  /* ── Masonry grid ── */
  .gallery{
    position:relative;
    padding:var(--gap);
    max-width:1800px;
    margin:0 auto;
    transition:opacity .1s ease;
  }
  .gallery.settling{opacity:.98}
  .gallery.settling-deep{opacity:.95;transition:opacity .18s ease}

  .gallery-item{
    position:absolute;
    cursor:pointer;
    border-radius:4px;
    overflow:hidden;
    line-height:0;
    opacity:0;
    transform:translateY(12px);
    transition:opacity .4s ease,transform .4s ease;
  }
  .gallery-item.loaded{
    opacity:1;
    transform:translateY(0);
  }
  .gallery-item.filtered-out{
    display:none !important;
  }
  .gallery-item img{
    width:100%;
    height:auto;
    display:block;
    transition:transform .3s ease;
  }
  .gallery-item:hover img{
    transform:scale(1.03);
  }

  /* ── Lightbox ── */
  .lightbox{
    position:fixed;inset:0;z-index:100;
    background:var(--lightbox-bg);
    display:none;
    align-items:center;
    justify-content:center;
    opacity:0;
    transition:opacity .25s ease;
    box-sizing:border-box;
    padding-bottom:var(--caption-h,80px);
  }
  .lightbox.active{
    display:flex;
    opacity:1;
  }
  .lightbox img{
    max-width:92vw;
    max-height:calc(100vh - var(--caption-h,80px) - 24px);
    max-height:calc(100dvh - var(--caption-h,80px) - 24px);
    object-fit:contain;
    border-radius:4px;
    user-select:none;
    -webkit-user-drag:none;
  }

  .lightbox-close{
    position:absolute;top:16px;right:20px;
    background:none;border:none;
    color:#fff;font-size:2rem;
    cursor:pointer;opacity:.7;
    transition:opacity .2s;
    line-height:1;
    z-index:110;
  }
  .lightbox-close:hover{opacity:1}

  .lightbox-nav{
    position:absolute;top:50%;transform:translateY(-50%);
    background:none;border:none;
    color:#fff;font-size:2.4rem;
    cursor:pointer;opacity:.5;
    transition:opacity .2s;
    padding:12px;
    z-index:110;
    user-select:none;
  }
  .lightbox-nav:hover{opacity:1}
  .lightbox-prev{left:12px}
  .lightbox-next{right:12px}

  .lightbox-caption{
    position:absolute;bottom:0;left:0;right:0;
    text-align:center;
    z-index:110;
    padding:28px 20px 18px;
    background:rgba(0,0,0,.55);
    backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
    color:rgba(255,255,255,.96);
  }
  .lightbox-location{
    font-family:'Libre Baskerville',Georgia,'Times New Roman',serif;
    font-size:.85rem;
    letter-spacing:.02em;
    line-height:1.5;
    text-shadow:0 2px 10px rgba(0,0,0,.85),0 0 2px rgba(0,0,0,.75);
  }
  .lightbox-caption .jp{
    text-shadow:0 2px 10px rgba(0,0,0,.85),0 0 2px rgba(0,0,0,.75);
  }
  .lightbox-city{opacity:.5}
  .lightbox-place{opacity:.85}
  .lightbox-counter{
    font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    font-variant-numeric:tabular-nums;
    font-size:.65rem;
    color:rgba(255,255,255,.35);
    margin-top:6px;
    letter-spacing:.04em;
    line-height:1;
    text-shadow:0 1px 4px rgba(0,0,0,.6);
  }
  .lightbox-sep{opacity:.45;margin:0 2px}

  .lightbox-spinner{
    position:absolute;
    width:36px;height:36px;
    border:3px solid rgba(255,255,255,.2);
    border-top-color:#fff;
    border-radius:50%;
    animation:spin .7s linear infinite;
    display:none;
  }
  .lightbox.loading .lightbox-spinner{display:block}
  @keyframes spin{to{transform:rotate(360deg)}}

  /* ── Scroll to top ── */
  .scroll-top{
    position:fixed;
    bottom:24px;right:24px;
    z-index:40;
    width:36px;height:36px;
    border-radius:50%;
    border:none;
    background:var(--text);
    color:var(--bg);
    font-size:.85rem;
    cursor:pointer;
    opacity:0;
    pointer-events:none;
    transition:opacity .3s ease,transform .3s ease;
    transform:translateY(8px);
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 2px 10px rgba(0,0,0,.15);
  }
  .scroll-top.visible{
    opacity:.5;
    pointer-events:auto;
    transform:translateY(0);
  }
  .scroll-top:hover{opacity:.8}
  @media(max-width:600px){
    .scroll-top{bottom:16px;right:16px;width:32px;height:32px;font-size:.75rem}
  }

  .jp{
  opacity:.65;
  font-size:.85em;
  margin-left:.25em;
  font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,
               "Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic",sans-serif;
  }

  /* ── Mobile ── */
  @media(max-width:600px){
    header{padding:10px 16px 8px}
    header h1{font-size:1.1rem}
    .header-byline{font-size:.6rem}
    .now-showing{font-size:.6rem;height:1em}
    .menu-btn{font-size:1.1rem}
    .menu-dropdown{right:16px;min-width:180px}
    .menu-item{padding:8px 14px;font-size:.7rem}
    .menu-search input{font-size:.65rem;padding:6px 9px}
    .menu-search-hint{font-size:.5rem}
    .lightbox-location{font-size:.75rem;line-height:1.45}
    .lightbox-caption{padding:24px 16px 14px}
    .lightbox-counter{font-size:.6rem;margin-top:5px}
    .lightbox-location .jp{font-size:.8em}
  }

  /* ── Compact caption: mobile landscape, short viewport (JS-driven) ── */
  html.compact-caption .lightbox-caption{
    padding:4px 14px 3px;
    background:rgba(0,0,0,.45);
  }
  html.compact-caption .lightbox-location{
    font-size:.55rem;
    line-height:1.3;
    display:-webkit-box;
    -webkit-line-clamp:2;
    -webkit-box-orient:vertical;
    overflow:hidden;
  }
  html.compact-caption .lightbox-counter{
    font-size:.45rem;
    margin-top:1px;
  }

  @media (max-width: 768px){
    /* iOS Safari zoom prevention: inputs must be >=16px */
    .menu-search input{font-size:16px;}
  }

</style>
</head>

<header>
  <div class="header-top">
    <h1 id="titleTap" aria-label="Scroll to top">Japan Spring 2025 <span class="header-byline">&middot; Edward Goss</span></h1>
    <button class="menu-btn" id="menuBtn" aria-label="Filter menu">&#9776;</button>
  </div>

  <div class="menu-dropdown" id="menuDropdown"></div>

<div class="menu-overlay" id="menuOverlay"></div>

<div class="gallery" id="gallery"></div>
<div class="no-results" id="noResults">No matches</div>

<button class="scroll-top" id="scrollTop" aria-label="Scroll to top">&uarr;</button>

<div class="lightbox" id="lightbox">
  <button class="lightbox-close" aria-label="Close">&times;</button>
  <button class="lightbox-nav lightbox-prev" aria-label="Previous">&lsaquo;</button>
  <button class="lightbox-nav lightbox-next" aria-label="Next">&rsaquo;</button>
  <div class="lightbox-spinner"></div>
  <img src="" alt="">
  <div class="lightbox-caption">
    <div class="lightbox-location">
      <span class="lightbox-city"></span>
      <span class="lightbox-place"></span>
    </div>
    <div class="lightbox-counter"></div>
  </div>
</div>

// Compact caption detection (JS-driven for iOS Safari reliability)
(function(){
  function getViewport(){
    // visualViewport is more reliable on iOS Safari (accounts for toolbar/keyboard)
    if(window.visualViewport){
      return{w:window.visualViewport.width,h:window.visualViewport.height};
    }
    return{w:window.innerWidth,h:window.innerHeight};
  }
  function updateCompact(){
    var vp=getViewport();
    var compact=vp.h<=600&&vp.w>vp.h&&vp.w<=1024;
    document.documentElement.classList.toggle('compact-caption',compact);
  }
  window.addEventListener('resize',updateCompact);
  if(window.visualViewport){
    window.visualViewport.addEventListener('resize',updateCompact);
  }
  window.addEventListener('orientationchange',function(){
    // iOS Safari needs time to settle after orientation change
    updateCompact();
    setTimeout(updateCompact,200);
    setTimeout(updateCompact,500);
  });
  updateCompact();
  // Expose for lightbox to call on open
  window._updateCompactCaption=updateCompact;
})();

  function getTopVisibleIndex(){
    // Find which filtered photo is closest to just below the header

    var scanY=headerH+20;
    var bestIdx=-1, bestDist=Infinity;
    for(var fi=0;fi<filtered.length;fi++){
      var rect=items[filtered[fi]].el.getBoundingClientRect();
      var dist=Math.abs(rect.top-scanY);
      if(rect.bottom>headerH&&dist<bestDist){

        bestIdx=filtered[fi];
      }
    }

    }
    updateNoResults();
  }

  function updateFiltered(){
    filtered=[];
    items.forEach(function(item,idx){
      const photoNum=idx+1;
      var cityMatch=activeFilter==='All'||cityMap[photoNum]===activeFilter;
      var searchMatch=true;
      if(activeSearch){
        var words=activeSearch.split(/\s+/);
        for(var wi=0;wi<words.length;wi++){
          if(words[wi]&&searchIndex[idx].indexOf(words[wi])===-1){searchMatch=false;break}
        }
      }
      var match=cityMatch&&searchMatch;
      item.el.classList.toggle('filtered-out',!match);
      if(match) filtered.push(idx);
    });
  }

  function updateNoResults(){
    noResults.classList.toggle('visible',filtered.length===0);
  }

  // ── "Now showing" label ──
  let lastShownKey='';
  function nowShowingHTML(city){
    var html='<span class="now-showing-label">Now showing \u00b7 </span><span class="now-showing-city">'+city+'</span>';
    if(activeFilter!=='All') html+=' <span class="now-showing-filtered">\u00b7 Filtered</span>';
    if(activeSearch){
      var q=searchInput.value.trim();
      if(q.length>20) q=q.slice(0,20)+'\u2026';
      html+=' <span class="now-showing-filtered">\u00b7 Search: '+q+'</span>';
    }
    return html;
  }
  let nowShowingTimer = null;
  let nowShowingInTransition = false;
  let pendingNowShowingKey = '';
  let pendingNowShowingCity = '';
  const NOW_SHOWING_FADE_MS = 150; // keep in sync with CSS

  function applyNowShowingImmediate(city, key){
    lastShownKey = key;
    pendingNowShowingKey = '';
    pendingNowShowingCity = '';
    nowShowingEl.innerHTML = nowShowingHTML(city);
    nowShowingEl.classList.remove('hidden');
  }

  function runNowShowingTransition(city, key){
    // Cancel any pending swap timer
    if (nowShowingTimer) {
      clearTimeout(nowShowingTimer);
      nowShowingTimer = null;
    }

    nowShowingInTransition = true;
    lastShownKey = key;

    function finishTransition(){
      if (nowShowingTimer) {
        clearTimeout(nowShowingTimer);
        nowShowingTimer = null;
      }

      nowShowingEl.innerHTML = nowShowingHTML(city);
      requestAnimationFrame(function(){
        nowShowingEl.classList.remove('hidden');
        nowShowingInTransition = false;

        // If a newer request arrived while fading, run it once
        if (pendingNowShowingKey && pendingNowShowingKey !== lastShownKey) {
          var nextKey = pendingNowShowingKey;
          var nextCity = pendingNowShowingCity;
          pendingNowShowingKey = '';
          pendingNowShowingCity = '';
          runNowShowingTransition(nextCity, nextKey);
        } else {
          pendingNowShowingKey = '';
          pendingNowShowingCity = '';
        }
      });
    }

    // If already hidden or empty (first paint), skip fade-out
    if (nowShowingEl.classList.contains('hidden') || !nowShowingEl.innerHTML) {
      finishTransition();
      return;
    }

    // Fade out on its own frame; swap after the fade duration
    requestAnimationFrame(function(){
      nowShowingEl.classList.add('hidden');
      nowShowingTimer = setTimeout(finishTransition, NOW_SHOWING_FADE_MS);
    });
  }

  function requestNowShowing(city){
    var key = city + '|' + activeFilter + '|' + activeSearch;

    // If we're already correct, do nothing (even mid-transition)
    if (key === lastShownKey) return;

    pendingNowShowingKey = key;
    pendingNowShowingCity = city;

    // First paint: set immediately so we don't fade in from blank
    if (!nowShowingEl.innerHTML && !nowShowingInTransition) {
      applyNowShowingImmediate(city, key);
      return;
    }

    if (nowShowingInTransition) return;

    runNowShowingTransition(city, key);
  }

  function updateNowShowing(){
    if (activeFilter !== 'All') {
      requestNowShowing(activeFilter);
      return;
    }
    // In "All" mode, detect from scroll position
    const headerH=document.querySelector('header').offsetHeight;
    const scanY=headerH+50;
    let bestCity='';
    let bestDist=Infinity;

    for(let fi=0;fi<filtered.length;fi++){
      const item=items[filtered[fi]];
      const rect=item.el.getBoundingClientRect();
      const dist=Math.abs(rect.top-scanY);
      if(rect.bottom>headerH&&dist<bestDist){
        bestDist=dist;
        bestCity=cityMap[filtered[fi]+1]||'';
      }
    }

    if (bestCity) {
      requestNowShowing(bestCity);
    }
  }

  // ── Build gallery items ──
  for(let i=1;i<=TOTAL;i++){
    const num=String(i).padStart(3,'0');
    const src='photos/Japan_Spring-2025_'+num+'.jpg';
    const div=document.createElement('div');
    div.className='gallery-item';
    div.dataset.index=i-1;
    div.dataset.photoNum=i;
    const img=document.createElement('img');
    img.alt='Japan Spring 2025 - '+(cityMap[i]||'Photo')+' '+i;
    if(i<=8){img.loading='eager';img.fetchPriority='high'}
    else{img.loading='lazy'}
    img.src=src;
    div.appendChild(img);
    gallery.appendChild(div);
    items.push({el:div,img:img,ratio:0,loaded:false});
  }

  updateFiltered();

  // ── Masonry layout ──
  function layout(){
    const cols=getColCount();
    const containerW=gallery.clientWidth;
    const colW=(containerW-(cols-1)*GAP)/cols;
    const colHeights=new Array(cols).fill(0);

    for(let fi=0;fi<filtered.length;fi++){
      const item=items[filtered[fi]];
      let minH=colHeights[0],minCol=0;
      for(let c=1;c<cols;c++){
        if(colHeights[c]<minH){minH=colHeights[c];minCol=c}
      }
      const x=minCol*(colW+GAP);
      const y=colHeights[minCol];
      const h=item.ratio?colW/item.ratio:colW;

      item.el.style.left=x+'px';
      item.el.style.top=y+'px';
      item.el.style.width=colW+'px';

      colHeights[minCol]=y+h+GAP;
    }
    gallery.style.height=(filtered.length?Math.max(...colHeights):0)+'px';
  }

  function getColCount(){
    const w=gallery.clientWidth;
    if(w<=480)return 1;
    if(w<=800)return 2;
    if(w<=1200)return 3;
    return 4;
  }

  // ── Batched layout scheduling ──
  let layoutQueued=false;
  function scheduleLayout(){
    if(!layoutQueued){
      layoutQueued=true;
      requestAnimationFrame(function(){
        layoutQueued=false;
        layout();
      });
    }
  }

  // ── Image load tracking ──
  function onImageReady(item){
    item.el.classList.add('loaded');
    scheduleLayout();
  }
  items.forEach(function(item){
    if(item.img.complete&&item.img.naturalWidth){
      item.ratio=item.img.naturalWidth/item.img.naturalHeight;
      item.loaded=true;
      item.el.classList.add('loaded');
    }else{
      item.img.onload=function(){
        item.ratio=item.img.naturalWidth/item.img.naturalHeight;
        item.loaded=true;
        if(item.img.decode){
          item.img.decode().then(function(){
            onImageReady(item);
          }).catch(function(){
            onImageReady(item);
          });
        }else{
          onImageReady(item);
        }
      };
    }
  });

  layout();
  updateNowShowing();

  let resizeTimer;
  let pendingLayoutAfterLightbox=false;
  function scheduleLayoutAfterLightbox(){
    clearTimeout(resizeTimer);
    resizeTimer=setTimeout(layout,200);
    setTimeout(layout,600);
  }
  window.addEventListener('resize',function(){
    if(lightbox.classList.contains('active')){
      pendingLayoutAfterLightbox=true;
      return;
    }
    clearTimeout(resizeTimer);
    resizeTimer=setTimeout(layout,100);
  });
  if(window.visualViewport){
    window.visualViewport.addEventListener('resize',function(){
      if(lightbox.classList.contains('active')){
        pendingLayoutAfterLightbox=true;
        return;
      }
      clearTimeout(resizeTimer);
      resizeTimer=setTimeout(layout,100);
    });
  }

  // ── Scroll to top button ──
  const scrollTopBtn=document.getElementById('scrollTop');
  scrollTopBtn.addEventListener('click',function(){
    window.scrollTo({top:0,behavior:'smooth'});
  });
  var scrollTopVisible=false;

  // ── Unified scroll handler ──
  let scrollTicking=false;
  window.addEventListener('scroll',function(){
    if(!scrollTicking){
      scrollTicking=true;
      requestAnimationFrame(function(){
        updateNowShowing();
        var show=window.scrollY>600;
        if(show!==scrollTopVisible){
          scrollTopVisible=show;
          scrollTopBtn.classList.toggle('visible',show);
        }
        scrollTicking=false;
      });
    }
  },{passive:true});

  // ── Lightbox ──
  gallery.addEventListener('click',function(e){
    const item=e.target.closest('.gallery-item');
    if(!item||item.classList.contains('filtered-out'))return;
    const idx=parseInt(item.dataset.index,10);
    current=filtered.indexOf(idx);
    if(current===-1)return;
    lightboxOpenCurrent=current;
    lightboxOpenWidth=document.documentElement.clientWidth;
    openLightbox();
  });

  function photoSrc(idx){
    return 'photos/Japan_Spring-2025_'+String(idx+1).padStart(3,'0')+'.jpg';
  }

  function openLightbox(){
    const realIdx=filtered[current];
    const photoNum=realIdx+1;
    lightbox.classList.add('loading');
    lbImg.onload=function(){
      lightbox.classList.remove('loading');
    };
    lbImg.src=photoSrc(realIdx);
    lbImg.alt='Japan Spring 2025 - Photo '+photoNum;

    const city=cityMap[photoNum]||'';
    const place=CAPTIONS[photoNum]||'';
    if(place){
      lbCity.textContent=city+' \u2014 ';
      lbPlace.innerHTML=place;
    }else{
      lbCity.textContent=city;
      lbPlace.textContent='';
    }

    lbCounter.innerHTML=(current+1)+' <span class="lightbox-sep">\u00b7</span> '+filtered.length;

    // Hide nav arrows at boundaries
    lightbox.querySelector('.lightbox-prev').style.display=current<=0?'none':'';
    lightbox.querySelector('.lightbox-next').style.display=current>=filtered.length-1?'none':'';

    lightbox.classList.add('active');
    document.body.style.overflow='hidden';

    // Re-check compact caption state on open
    if(window._updateCompactCaption) window._updateCompactCaption();

    // Measure caption height so image fits above it
    requestAnimationFrame(updateCaptionHeight);

    // Preload adjacent images for snappy navigation
    if(current+1<filtered.length) new Image().src=photoSrc(filtered[current+1]);
    if(current-1>=0) new Image().src=photoSrc(filtered[current-1]);

  }

  function closeLightbox(){
    lightbox.classList.remove('active','loading');
    document.body.style.overflow='';
    lbImg.src='';
    lightbox.style.removeProperty('--caption-h');
    // Re-layout in case viewport changed while lightbox was open
    pendingLayoutAfterLightbox=false;
    scheduleLayoutAfterLightbox();
    // Scroll to current photo if user navigated OR viewport changed (zoom)
    var didNavigate=current!==lightboxOpenCurrent;
    var viewportChanged=document.documentElement.clientWidth!==lightboxOpenWidth;
    if((didNavigate||viewportChanged)&&current>=0&&current<filtered.length){
      var el=items[filtered[current]].el;
      var headerH=document.querySelector('header').offsetHeight;
      var galleryTop=gallery.getBoundingClientRect().top+window.scrollY;
      var photoTop=parseFloat(el.style.top)+galleryTop;
      window.scrollTo({top:photoTop-headerH-10,behavior:'instant'});
    }
  }

  function navigate(dir){
    var next=current+dir;
    if(next<0||next>=filtered.length) return;
    current=next;
    openLightbox();
  }

  lightbox.querySelector('.lightbox-close').addEventListener('click',closeLightbox);
  lightbox.querySelector('.lightbox-prev').addEventListener('click',function(){navigate(-1)});
  lightbox.querySelector('.lightbox-next').addEventListener('click',function(){navigate(1)});


  lightbox.addEventListener('click',function(e){
    if(e.target===lightbox)closeLightbox();
  });

  document.addEventListener('keydown',function(e){
    // Don't capture keys when typing in search
    var inSearch=document.activeElement===searchInput;

    if(e.key==='Escape'){
      if(lightbox.classList.contains('active')){closeLightbox();return}
      if(activeSearch){clearSearch();searchInput.blur();return}
      if(menuOpen){closeMenu();return}
    }

    // / key opens menu and focuses search (only when not typing)
    if(e.key==='/'&&!inSearch&&!lightbox.classList.contains('active')){
      e.preventDefault();
      if(!menuOpen) openMenu();
      searchInput.focus();
      return;
    }

    if(!lightbox.classList.contains('active'))return;
    if(e.key==='ArrowLeft')navigate(-1);
    else if(e.key==='ArrowRight')navigate(1);
  });

  let touchStartX=0;
  let touchIsMulti=false;
  lightbox.addEventListener('touchstart',function(e){
    touchIsMulti=e.touches.length>1;
    touchStartX=e.changedTouches[0].screenX;
  },{passive:true});
  lightbox.addEventListener('touchmove',function(e){
    if(e.touches.length>1) touchIsMulti=true;
  },{passive:true});
  lightbox.addEventListener('touchend',function(e){
    if(touchIsMulti) return;
    const diff=e.changedTouches[0].screenX-touchStartX;
    if(Math.abs(diff)>50){
      navigate(diff>0?-1:1);
    }
  },{passive:true});

  // Keep caption height measurement up to date on resize/rotation
  window.addEventListener('resize',updateCaptionHeight);
  if(window.visualViewport){
    window.visualViewport.addEventListener('resize',updateCaptionHeight);
  }
  window.addEventListener('orientationchange',function(){
    // iOS Safari needs time to settle after orientation change
    updateCaptionHeight();
    setTimeout(updateCaptionHeight,200);
    setTimeout(updateCaptionHeight,500);
  });

})();
</script>
</body>
</html>
