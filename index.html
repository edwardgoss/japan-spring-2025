<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<!-- Keep shrink-to-fit disabled to prevent iPad Safari portrait auto-shrink after rotation. -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, shrink-to-fit=no">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#111111">
<title>Japan Spring 2025</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

  :root{
    --bg:#f5f5f5;
    --text:#222;
    --text-secondary:#888;
    --header-bg:rgba(245,245,245,.85);
    --gap:6px;
    --lightbox-bg:rgba(0,0,0,.92);
    --menu-bg:#fff;
    --menu-shadow:0 4px 20px rgba(0,0,0,.12);
    --menu-hover:rgba(0,0,0,.04);
    --menu-active-bg:#222;
    --menu-active-text:#fff;
    --menu-border:rgba(0,0,0,.06);
    --menu-input-bg:rgba(0,0,0,.03);
    --menu-input-border:rgba(0,0,0,.18);
    --menu-input-text:rgba(34,34,34,.92);
    --menu-input-placeholder:rgba(34,34,34,.55);
    --menu-hint-color:rgba(34,34,34,.58);
    --subheader-label:rgba(34,34,34,.78);
    --subheader-city:rgba(34,34,34,.94);
    --subheader-meta:rgba(34,34,34,.74);
    --subheader-query:rgba(34,34,34,.84);
    --header-scrim-top:rgba(0,0,0,.18);
    --header-scrim-bottom:rgba(0,0,0,.08);
    --lightbox-photo-gap:12px;
  }
  @media(prefers-color-scheme:dark){
    :root{
      --bg:#111;
      --text:#e0e0e0;
      --text-secondary:#777;
      --header-bg:rgba(17,17,17,.85);
      --menu-bg:#1e1e1e;
      --menu-shadow:0 4px 20px rgba(0,0,0,.4);
      --menu-hover:rgba(255,255,255,.06);
      --menu-active-bg:#e0e0e0;
      --menu-active-text:#111;
      --menu-border:rgba(255,255,255,.08);
      --menu-input-bg:rgba(255,255,255,.12);
      --menu-input-border:rgba(255,255,255,.22);
      --menu-input-text:rgba(255,255,255,.92);
      --menu-input-placeholder:rgba(255,255,255,.55);
      --menu-hint-color:rgba(255,255,255,.62);
      --subheader-label:rgba(224,224,224,.8);
      --subheader-city:rgba(224,224,224,.96);
      --subheader-meta:rgba(224,224,224,.76);
      --subheader-query:rgba(224,224,224,.86);
      --header-scrim-top:rgba(0,0,0,.28);
      --header-scrim-bottom:rgba(0,0,0,.14);
    }
  }

  html{
    -webkit-text-size-adjust:100%;
    text-size-adjust:100%;
    color-scheme:light dark;
    overflow-x:hidden;
    background:var(--bg);
  }
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'Libre Baskerville',Georgia,'Times New Roman',serif;
    min-height:100vh;
    width:100%;
    overflow-x:hidden;
    padding-top:var(--header-offset,0px);
    touch-action:manipulation;
  }
  body.menu-open{
    overflow:hidden;
    position:fixed;
    left:0;
    right:0;
    width:100%;
    top:calc(-1 * var(--menu-lock-scroll,0px));
  }

  /* ── Header ── */
  header{
    position:fixed;
    top:0;left:0;right:0;z-index:50;
    background:var(--header-bg);
    backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
    padding:
      calc(8px + env(safe-area-inset-top))
      calc(24px + min(env(safe-area-inset-right), 12px))
      6px
      calc(24px + min(env(safe-area-inset-left), 12px));
    text-align:center;
    isolation:isolate;
  }
  html.orientation-settling header{
    backdrop-filter:none;
    -webkit-backdrop-filter:none;
  }
  header::before{
    content:"";
    position:absolute;
    inset:0;
    z-index:0;
    pointer-events:none;
    background:linear-gradient(
      to bottom,
      var(--header-scrim-top),
      var(--header-scrim-bottom)
    );
  }
  .header-top,.now-showing,.menu-dropdown{
    position:relative;
    z-index:1;
  }

  .header-top{
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
  }

  header h1{
    font-size:1.5rem;
    font-weight:600;
    letter-spacing:.04em;
    line-height:1.3;
  }
  
  /* Title is tappable, but should not look like a button */
  #titleTap{
    cursor:pointer;
    -webkit-tap-highlight-color: transparent;
  }
.header-byline{
    font-weight:400;
    font-size:.7rem;
    opacity:.4;
    letter-spacing:.02em;
  }

  /* Hamburger button */
  .menu-btn{
    position:absolute;
    right:0;top:50%;transform:translateY(-50%);
    background:none;border:none;
    color:var(--text);
    font-size:1.35rem;
    cursor:pointer;
    opacity:.5;
    transition:opacity .2s;
    padding:6px 4px;
    line-height:1;
  }
  .menu-btn:hover{opacity:.8}

  /* Now showing label */
  .now-showing{
    font-size:.73rem;
    color:var(--subheader-label);
    margin-top:3px;
    line-height:1.25;
    min-height:1.25em;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
    letter-spacing:.02em;
    transition:opacity .18s ease-in-out;
    transform:translate3d(0,0,0);
    will-change:opacity;
    -webkit-font-smoothing:antialiased;
  }
  .now-showing.hidden{opacity:0}
  .now-showing-label{
    color:var(--subheader-label);
    opacity:1;
    font-weight:500;
  }
  .now-showing-city{
    color:var(--subheader-city);
    font-weight:600;
  }
  .now-showing-filtered{
    color:var(--subheader-meta);
    opacity:1;
    font-size:.66rem;
    font-weight:500;
  }
  .now-showing-query{
    white-space:inherit;
    color:var(--subheader-query);
    font-weight:500;
  }

  /* ── Dropdown menu ── */
  .menu-overlay{
    position:fixed;inset:0;z-index:49;
    display:none;
  }
  .menu-overlay.open{display:block}

  .menu-dropdown{
    position:absolute;
    top:100%;right:24px;
    background:var(--menu-bg);
    border-radius:8px;
    box-shadow:var(--menu-shadow);
    width:260px;
    max-width:calc(100vw - 32px);
    padding:6px 0;
    z-index:51;
    opacity:0;
    transform:translateY(-4px);
    pointer-events:none;
    transition:opacity .15s ease,transform .15s ease;
  }
  .menu-dropdown.open{
    opacity:1;
    transform:translateY(0);
    pointer-events:auto;
  }

  .menu-item{
    display:flex;
    align-items:center;
    justify-content:space-between;
    width:100%;
    background:none;border:none;
    padding:10px 18px;
    font-family:'Libre Baskerville',Georgia,'Times New Roman',serif;
    font-size:.78rem;
    color:var(--text);
    cursor:pointer;
    text-align:left;
    transition:background .15s;
    letter-spacing:.02em;
  }
.menu-clear-all{margin-top:10px; font-size:0.95rem; opacity:0.9;}
  .menu-item:hover{
    background:var(--menu-hover);
  }
  .menu-item.active{
    background:var(--menu-active-bg);
    color:var(--menu-active-text);
  }
  .menu-item-count{
    opacity:.4;
    font-size:.68rem;
    margin-left:12px;
    font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    font-variant-numeric:tabular-nums;
  }
  .menu-item.active .menu-item-count{
    opacity:.6;
  }

  .menu-search{
    padding:9px 14px 6px;
    position:relative;
  }
  .menu-search input{
    width:100%;
    padding:8px 38px 8px 11px;
    border:1px solid var(--menu-input-border);
    border-radius:5px;
    background:var(--menu-input-bg);
    color:var(--menu-input-text);
    font-family:'Libre Baskerville',Georgia,'Times New Roman',serif;
    font-size:.88rem;
    outline:none;
    letter-spacing:.02em;
    transition:border-color .15s,background-color .15s;
  }
  .menu-search input[type="search"]::-webkit-search-cancel-button,
  .menu-search input[type="search"]::-webkit-search-decoration,
  .menu-search input[type="search"]::-webkit-search-results-button,
  .menu-search input[type="search"]::-webkit-search-results-decoration{
    -webkit-appearance:none;
    appearance:none;
  }
  .menu-search-clear{
    position:absolute;
    right:18px;top:24px;
    transform:translateY(-50%);
    background:none;border:none;
    color:var(--text-secondary);
    font-size:1.32rem;
    cursor:pointer;
    opacity:0;
    pointer-events:none;
    transition:opacity .15s;
    padding:2px 5px;
    line-height:1;
  }
  .menu-search-clear.visible{
    opacity:.5;
    pointer-events:auto;
  }
  .menu-search-clear:hover{opacity:.8}
  .menu-search input::placeholder{
    color:var(--menu-input-placeholder);
    opacity:1;
  }
  .menu-search input:focus{
    border-color:var(--menu-input-border);
  }
  .menu-search-hint{
    font-size:.6rem;
    color:var(--menu-hint-color);
    opacity:.82;
    padding:3px 2px 0;
    letter-spacing:.01em;
  }

  .no-results{
    text-align:center;
    color:var(--text-secondary);
    font-size:.8rem;
    padding:60px 20px;
    opacity:.5;
    font-style:italic;
    display:none;
  }
  .no-results.visible{display:block}

  .menu-divider{
    height:1px;
    background:var(--menu-border);
    margin:4px 0;
  }
  .menu-footer-divider{
    margin-top:8px;
    margin-bottom:0;
  }
  .menu-footer-credit{
    padding:10px 16px 12px;
    font-family:'Libre Baskerville',Georgia,'Times New Roman',serif;
    font-size:.72rem;
    letter-spacing:.02em;
    font-weight:500;
    color:var(--text);
    opacity:.72;
    text-align:center;
  }

  /* ── Masonry grid ── */
  .gallery{
    position:relative;
    padding:var(--gap);
    max-width:1800px;
    margin:0 auto;
    overflow:hidden;
    background:var(--bg);
    transition:opacity .1s ease;
  }
  .gallery.settling{opacity:.98}
  .gallery.settling-deep{opacity:.95;transition:opacity .18s ease}

  .gallery-item{
    position:absolute;
    cursor:pointer;
    border-radius:4px;
    overflow:hidden;
    line-height:0;
    opacity:0;
    transform:translateY(12px);
    transition:opacity .4s ease,transform .4s ease;
  }
  .gallery-item.loaded{
    opacity:1;
    transform:translateY(0);
  }
  .gallery-item.filtered-out{
    display:none !important;
  }
  .gallery-item img{
    width:100%;
    height:auto;
    display:block;
    opacity:0;
    transition:opacity .42s ease-out,transform .3s ease;
  }
  .gallery-item.revealed img{
    opacity:1;
  }
  @media (hover: hover) and (pointer: fine){
    .gallery-item:hover img{
      transform:scale(1.03);
    }
  }

  /* ── Lightbox ── */
  .lightbox{
    position:fixed;
    top:0;left:0;right:0;
    height:var(--lightbox-vh,100vh);
    height:var(--lightbox-vh,100dvh);
    z-index:100;
    --lightbox-top-clearance:0px;
    --lightbox-spinner-size:32px;
    --lightbox-bottom-cover:0px;
    display:none;
    grid-template-rows:minmax(0,1fr) auto;
    align-items:stretch;
    justify-items:stretch;
    opacity:0;
    transition:opacity .25s ease;
    touch-action:pan-x pan-y pinch-zoom;
    overflow:hidden;
  }
  .lightbox.active{
    display:grid;
    opacity:1;
    background:var(--lightbox-bg);
  }
  .lightbox.active::after{
    content:"";
    position:fixed;
    left:0;right:0;bottom:0;
    height:var(--lightbox-bottom-cover);
    background:transparent;
    pointer-events:none;
    z-index:109;
  }
  html.firefox-mobile-bottom-cover .lightbox.active::after{
    background:var(--lightbox-bg);
  }
  .lightbox img{
    grid-row:1;
    align-self:center;
    justify-self:center;
    max-width:92vw;
    max-height:calc(100vh - var(--caption-h,80px) - (var(--lightbox-photo-gap) * 2));
    max-height:calc(100dvh - var(--caption-h,80px) - (var(--lightbox-photo-gap) * 2));
    margin-block:var(--lightbox-photo-gap);
    object-fit:contain;
    border-radius:4px;
    user-select:none;
    -webkit-user-drag:none;
    touch-action:pan-x pan-y pinch-zoom;
  }

  .lightbox-close{
    position:absolute;
    top:max(8px, calc(8px + env(safe-area-inset-top)));
    right:max(20px, calc(12px + env(safe-area-inset-right)));
    background:none;border:none;
    color:#fff;font-size:2rem;
    cursor:pointer;opacity:.7;
    transition:opacity .2s;
    line-height:1;
    z-index:110;
  }
  .lightbox-close:hover{opacity:1}

  .lightbox-nav{
    position:absolute;top:var(--lightbox-nav-top, calc(50% - var(--caption-h,80px) / 2));transform:translateY(-50%);
    background:none;border:none;
    color:#fff;font-size:2.4rem;
    cursor:pointer;opacity:.5;
    transition:opacity .2s;
    padding:12px;
    z-index:110;
    user-select:none;
  }
  .lightbox-nav:hover{opacity:1}
  .lightbox-prev{left:max(12px, env(safe-area-inset-left))}
  .lightbox-next{right:max(12px, env(safe-area-inset-right))}

  .lightbox-caption{
    position:relative;
    grid-row:2;
    width:100%;
    text-align:center;
    z-index:110;
    padding:
      28px
      calc(20px + min(env(safe-area-inset-right), 6px))
      calc(18px + min(env(safe-area-inset-bottom), 8px))
      calc(20px + min(env(safe-area-inset-left), 6px));
    background:rgba(0,0,0,.55);
    backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
    color:rgba(255,255,255,.96);
    touch-action:none;
  }
  .lightbox-location{
    font-family:'Libre Baskerville',Georgia,'Times New Roman',serif;
    font-size:.85rem;
    letter-spacing:.02em;
    line-height:1.5;
    text-shadow:0 2px 10px rgba(0,0,0,.85),0 0 2px rgba(0,0,0,.75);
  }
  .lightbox-caption .jp{
    text-shadow:0 2px 10px rgba(0,0,0,.85),0 0 2px rgba(0,0,0,.75);
  }
  .lightbox-city{opacity:.5}
  .lightbox-place{opacity:.85}
  .lightbox-counter{
    font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    font-variant-numeric:tabular-nums;
    font-size:.65rem;
    color:rgba(255,255,255,.35);
    margin-top:6px;
    letter-spacing:.04em;
    line-height:1;
    text-shadow:0 1px 4px rgba(0,0,0,.6);
  }
  .lightbox-sep{opacity:.45;margin:0 2px}

  /* ── Caption truncation (mobile portrait only) ── */
  .lightbox-more{
    display:none; /* shown/hidden via JS */
    background:none;border:none;padding:0;
    font-family:'Libre Baskerville',Georgia,'Times New Roman',serif;
    font-size:.75rem;
    color:rgba(255,255,255,.38);
    cursor:pointer;
    letter-spacing:.02em;
    line-height:1.45;
    -webkit-tap-highlight-color:transparent;
    vertical-align:baseline;
  }
  @media(max-width:600px){
    .lightbox-more{font-size:.7rem}
  }

  .lightbox-spinner{
    position:absolute;
    top:calc(50% - var(--caption-h,80px) / 2 - (var(--lightbox-spinner-size) / 2));
    left:calc(50% - (var(--lightbox-spinner-size) / 2));
    width:var(--lightbox-spinner-size);
    height:var(--lightbox-spinner-size);
    border:3px solid rgba(255,255,255,.2);
    border-top-color:#fff;
    border-radius:50%;
    animation:spin .7s linear infinite;
    pointer-events:none;
    z-index:111;
    display:none;
  }
  .lightbox.loading-visible .lightbox-spinner{display:block}
  @keyframes spin{to{transform:rotate(360deg)}}

  /* ── Scroll to top ── */
  .scroll-top{
    position:fixed;
    bottom:max(24px, calc(12px + env(safe-area-inset-bottom)));
    right:max(24px, calc(12px + env(safe-area-inset-right)));
    z-index:40;
    width:36px;height:36px;
    border-radius:50%;
    border:none;
    background:var(--text);
    color:var(--bg);
    font-size:.85rem;
    cursor:pointer;
    opacity:0;
    pointer-events:none;
    transition:opacity .3s ease,transform .3s ease;
    transform:translateY(8px);
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 2px 10px rgba(0,0,0,.15);
  }
  .scroll-top.visible{
    opacity:.5;
    pointer-events:auto;
    transform:translateY(0);
  }
  .scroll-top:hover{opacity:.8}
  @media(max-width:600px){
    .scroll-top{
      bottom:max(16px, calc(8px + env(safe-area-inset-bottom)));
      right:max(16px, calc(8px + env(safe-area-inset-right)));
      width:32px;height:32px;font-size:.75rem
    }
  }

  .jp{
  opacity:.65;
  font-size:.85em;
  margin-left:.25em;
  font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,
               "Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic",sans-serif;
  }

  @media(min-width:1025px) and (hover:hover) and (pointer:fine){
    header h1{font-size:1.78rem}
    .now-showing{font-size:.86rem;line-height:1.28;min-height:1.28em}
    .now-showing-filtered{font-size:.77rem}
    .menu-btn{font-size:1.45rem}
  }

  /* ── Mobile ── */
  @media(max-width:600px){
    header{
      padding:
        calc(9px + env(safe-area-inset-top))
        calc(16px + min(env(safe-area-inset-right), 10px))
        7px
        calc(16px + min(env(safe-area-inset-left), 10px));
    }
    header h1{font-size:1.4rem}
    .now-showing{font-size:.68rem;line-height:1.3;min-height:1.3em}
    .now-showing-filtered{font-size:.67rem}
    .menu-btn{font-size:1.4rem;padding:6px 6px}
    .menu-dropdown{right:16px;width:240px;max-width:calc(100vw - 32px)}
    .menu-item{padding:9px 15px;font-size:.74rem}
    .menu-search input{font-size:.6rem;padding:6px 34px 6px 9px}
    .menu-search-hint{font-size:.52rem}
    .menu-footer-credit{font-size:.7rem;opacity:.68}
    .lightbox-location{font-size:.75rem;line-height:1.45}
    .lightbox-caption{
      padding:
        24px
        calc(16px + min(env(safe-area-inset-right), 6px))
        calc(14px + env(safe-area-inset-bottom))
        calc(16px + min(env(safe-area-inset-left), 6px));
    }
    .lightbox-counter{font-size:.6rem;margin-top:5px}
    .lightbox-location .jp{font-size:.8em}
  }

  /* ── Compact caption: mobile landscape, short viewport (JS-driven) ── */
  html.compact-caption .lightbox-caption{
    padding:
      4px
      calc(14px + min(env(safe-area-inset-right), 4px))
      calc(3px + min(env(safe-area-inset-bottom), 10px))
      calc(14px + min(env(safe-area-inset-left), 4px));
    background:rgba(0,0,0,.45);
    /* Keep caption hit-testable so touch-action:none can suppress pinch here. */
    pointer-events:auto;
    -webkit-user-select:none;
    user-select:none;
    -webkit-touch-callout:none;
  }
  html.compact-caption .lightbox-location{
    font-size:.55rem;
    line-height:1.3;
    display:-webkit-box;
    -webkit-line-clamp:2;
    -webkit-box-orient:vertical;
    overflow:hidden;
  }
  html.compact-caption .lightbox-counter{
    font-size:.45rem;
    margin-top:1px;
  }

  /* Touch landscape: keep pinch and swipes anchored to the image, not caption text. */
  @media (orientation: landscape) and (hover: none) and (pointer: coarse){
    .lightbox-caption{
      pointer-events:auto;
      -webkit-user-select:none;
      user-select:none;
      -webkit-touch-callout:none;
    }
  }

  /* Phone landscape: lift compact lightbox caption legibility slightly */
  @media (orientation: landscape) and (max-width: 950px) and (max-height: 500px){
    html.compact-caption .lightbox-caption{
      padding:
        6px
        calc(14px + min(env(safe-area-inset-right), 4px))
        calc(5px + min(env(safe-area-inset-bottom), 10px))
        calc(14px + min(env(safe-area-inset-left), 4px));
    }
    html.compact-caption .lightbox-location{
      font-size:.62rem;
      line-height:1.36;
    }
    html.compact-caption .lightbox-city{opacity:.62}
    html.compact-caption .lightbox-place{opacity:.9}
    html.compact-caption .lightbox-counter{
      font-size:.52rem;
      margin-top:2px;
      color:rgba(255,255,255,.42);
    }
  }

  /* Mobile portrait: reserve a top control gutter so tall portrait photos
     do not sit under the close button or corner loading indicator. */
  @media (orientation: portrait) and (hover: none) and (pointer: coarse){
    .lightbox{
      --lightbox-top-clearance:calc(30px + env(safe-area-inset-top));
    }
    .lightbox img{
      max-height:calc(100vh - var(--caption-h,80px) - (var(--lightbox-photo-gap) * 2) - var(--lightbox-top-clearance));
      max-height:calc(100dvh - var(--caption-h,80px) - (var(--lightbox-photo-gap) * 2) - var(--lightbox-top-clearance));

(function(){
  var themeColorMeta=document.querySelector('meta[name="theme-color"]');
  if(!themeColorMeta) return;

  var darkModeQuery=window.matchMedia('(prefers-color-scheme: dark)');
  function currentThemeColor(){
    var lightboxEl=document.getElementById('lightbox');
    if(lightboxEl&&lightboxEl.classList.contains('active')) return '#000000';
    return darkModeQuery.matches?'#111111':'#f5f5f5';
  }
  function applyThemeColor(){
    themeColorMeta.setAttribute('content',currentThemeColor());
  }

  applyThemeColor();
  if(typeof darkModeQuery.addEventListener==='function'){
    darkModeQuery.addEventListener('change',applyThemeColor);
  }else if(typeof darkModeQuery.addListener==='function'){
    darkModeQuery.addListener(applyThemeColor);
  }

  window._syncBrowserThemeColor=applyThemeColor;
})();

// Force fresh loads/reloads to start at top (Safari inactivity refresh included).
(function(){
  var navEntries=(typeof performance!=='undefined'&&performance.getEntriesByType)?performance.getEntriesByType('navigation'):null;

  var navType=navEntry&&navEntry.type?navEntry.type:'navigate';
  var hasHash=!!(window.location.hash&&window.location.hash!=='#');
  var shouldForceTop=!hasHash&&navType!=='back_forward';
  if(!shouldForceTop) return;

  function forceTop(){
    window.scrollTo({top:0,left:0,behavior:'instant'});
  }

  if(document.readyState==='loading'){
    document.addEventListener('DOMContentLoaded',forceTop,{once:true});
  }else{
    forceTop();
  }

  window.addEventListener('load',function(){
    forceTop();
    setTimeout(forceTop,120);
  });
  window.addEventListener('pageshow',function(e){
    if(e.persisted) return;
    forceTop();

  });
})();

(function(){
  function isViewportPinchScaled(){
    return !!(window.visualViewport&&typeof window.visualViewport.scale==='number'&&window.visualViewport.scale>1.01);

  function getViewport(){
    // visualViewport is more reliable on iOS Safari (accounts for toolbar/keyboard)
    if(window.visualViewport){

    var vp=getViewport();
    var compact=vp.h<=600&&vp.w>vp.h&&vp.w<=1024;
    document.documentElement.classList.toggle('compact-caption',compact);
  }

  // visualViewport while Safari's values are still mid-transition.
  var compactTimer=null;

  // Collect all leaf text nodes inside `root`, excluding `stopEl` subtree
  function getLeafTextNodes(root, stopEl){
    var result=[];
    function walk(node){
      if(node===stopEl) return;
      if(node.nodeType===Node.TEXT_NODE){
        if(node.data.trim()) result.push(node);
      } else {
        for(var i=0;i<node.childNodes.length;i++) walk(node.childNodes[i]);
      }
    }
    walk(root);
    return result;
  }

  function applyCaptionClamp(){
    resetCaptionClamp();
    if(!lightbox.classList.contains('active')) return;
    if(!isMobilePortrait()) return;
    var locationStyle=getComputedStyle(lbLocation);
    var oneLineH=parseFloat(locationStyle.lineHeight);
    if(!isFinite(oneLineH)||oneLineH<=0){
      var fs=parseFloat(locationStyle.fontSize)||14;
      oneLineH=fs*1.45;
    }
    function overflowsOneLine(){
      // Width overflow is the primary signal; height check is a fallback for iOS quirks.
      if(lbLocation.clientWidth<=0) return false;
      if(lbLocation.scrollWidth>lbLocation.clientWidth+1) return true;
      return lbLocation.getBoundingClientRect().height>Math.round(oneLineH*1.18);
    }

    // Hide more button for initial check
    lbMore.style.display='none';

    // If already fits on one line, nothing to do
    if(!overflowsOneLine()) return;

    // Show more button inline — it must fit on the same line
    lbMore.style.display='inline';

    // Collect all leaf text nodes (in document order) inside lbLocation,
    // skipping the lbMore subtree
    var leafNodes=getLeafTextNodes(lbLocation, lbMore);

    var savedStates=[]; // {node, orig} for all nodes we've touched
    var hiddenEls=[];   // element nodes we've fully hidden

    // Work from the last leaf text node backwards.
    // We always place an ellipsis — never exit the loop early just because
    // blanking a node happened to make it fit (we still need to add the …).
    for(var i=leafNodes.length-1;i>=0;i--){
      var textNode=leafNodes[i];
      var orig=textNode.data;
      savedStates.unshift({node:textNode, orig:orig});

      // Binary search: find the longest prefix + ellipsis that fits on one line
      var lo=0, hi=orig.length, best=-1;
      while(lo<=hi){
        var mid=Math.floor((lo+hi)/2);
        textNode.data=orig.slice(0,mid)+'\u2026';
        if(!overflowsOneLine()){ best=mid; lo=mid+1; }
        else hi=mid-1;
      }

      if(best<0){
        // Even just the ellipsis alone doesn't fit here — blank and try prev node
        textNode.data='';
      } else {
        // Trim to `best` chars and ensure we only ever render a single ellipsis.
        var trimmed=orig.slice(0,best)

          .replace(/(?:\u2026|\.{3,})+$/,'');
        textNode.data=trimmed+'\u2026';
        break; // ellipsis placed, done
      }
    }

    // If still overflowing after emptying all text nodes, hide whole element children
    // from the end of lbLocation (shouldn't normally be needed)
    if(overflowsOneLine()){
      var topChildren=Array.from(lbLocation.childNodes).filter(function(n){ return n!==lbMore; });
      for(var k=topChildren.length-1;k>=0;k--){
        if(!overflowsOneLine()) break;
        if(topChildren[k].nodeType===Node.ELEMENT_NODE){
          topChildren[k].style.display='none';
          hiddenEls.push(topChildren[k]);
        }
      }
    }

    lbLocation._clampState=savedStates;
    lbLocation._hiddenEls=hiddenEls.length ? hiddenEls : null;
    lbCaption.classList.add('clamped');
  }

  lightbox.addEventListener('touchend',function(e){
    if(touchIsMulti) return;
    const diff=e.changedTouches[0].screenX-touchStartX;
    if(Math.abs(diff)>50){
      navigate(diff>0?-1:1);
    }
  },{passive:true});
  function isGestureCenterInCaption(e){
    if(!lightbox.classList.contains('active')) return false;
    if(!isLandscapeTouchViewport()) return false;
    var x=typeof e.clientX==='number'?e.clientX:(typeof e.pageX==='number'?e.pageX-window.scrollX:null);
    var y=typeof e.clientY==='number'?e.clientY:(typeof e.pageY==='number'?e.pageY-window.scrollY:null);
    if(x===null||y===null) return false;
    var rect=lbCaption.getBoundingClientRect();
    return x>=rect.left-1&&x<=rect.right+1&&y>=rect.top-1&&y<=rect.bottom+1;
  }
  lightbox.addEventListener('gesturestart',function(e){
    if(isGestureCenterInCaption(e)) e.preventDefault();
  },{passive:false});
  lightbox.addEventListener('gesturechange',function(e){
    if(isGestureCenterInCaption(e)) e.preventDefault();
  },{passive:false});

  // Keep caption height measurement up to date on resize/rotation
  window.addEventListener('resize',function(){
    if(lightbox.classList.contains('active')&&isViewportPinchScaled()) return;
    updateCaptionHeight();
    if(lightbox.classList.contains('active')) scheduleCaptionClampPasses();
  });
  if(window.visualViewport){
    window.visualViewport.addEventListener('resize',function(){
      if(lightbox.classList.contains('active')&&isViewportPinchScaled()) return;
      updateCaptionHeight();
      if(lightbox.classList.contains('active')) scheduleCaptionClampPasses();
    });
  }
  window.addEventListener('orientationchange',function(){
    if(lightbox.classList.contains('active')) lightboxRotatedWhileOpen=true;
    setTimeout(function(){
      updateCaptionHeight();
      if(lightbox.classList.contains('active')) scheduleCaptionClampPasses();
    },400);
  });

})();
</script>
